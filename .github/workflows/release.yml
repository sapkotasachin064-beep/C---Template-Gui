name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release | x64)
        run: msbuild CppTemplateGui.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $content = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($content, "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)")
          if (-not $match.Success) { throw "No CHANGELOG.md section found for version '$version'" }
          $match.Value.Trim() | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md bin/x64/Release/*.exe
